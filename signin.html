
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDX CINEMAS - Sign In</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

    <!-- Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo">MINDX CINEMAS</a>
    </header>

    <section class="signin-section">
        <div class="signin-container">
            <h1>Welcome Back</h1>
            <p>Sign in to continue</p>

            <form id="login-form" novalidate>
                <div class="input-box">
                    <label>Email</label>
                    <input type="email" id="signin-email" placeholder="Enter your email" required maxlength="50">
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" id="signin-password" placeholder="Enter your password" required minlength="8" maxlength="20">
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" id="button">Sign In</button>

                <p class="signup-link">
                    Don’t have an account? <a href="signup.html">Sign Up</a>
                </p>
            </form>
        </div>
    </section>

    <script src="./js/script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <section class="signup-section">
        <div class="signup-container">
            <h1>Create Account</h1>
            <p>Join today and get started</p>

            <form id="signupForm" novalidate>
                <div class="input-box">
                    <label>Full Name</label>
                    <input type="text" id="username" placeholder="Enter your full name">
                    <small class="error-msg" id="usernameError"></small>
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <small class="error-msg" id="emailError"></small>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                    <small class="error-msg" id="passwordError"></small>
                </div>

                <div class="input-box">
                    <label>Confirm Password</label>
                    <input type="password" id="verifyPassword" placeholder="Confirm your password">
                    <small class="error-msg" id="verifyPasswordError"></small>
                </div>

                <div class="terms">
                    <input type="checkbox" id="terms">
                    <span>I agree to the Terms & Conditions</span>
                </div>
                
               <a href="11.html" type="button" id="button">Sign Up</a>

                <p class="login-link">Already have an account? <a href="signin.html">Log In</a></p>
            </form>
        </div>
    </section>
    
    <script src="signup.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINDX CINEMAS - Profile Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <header class="navbar" id="top_header">
    <a href="main.html" class="logo">MINDX CINEMAS</a>
    <ul class="nav-links">
      <li><a href="main.html">Home</a></li>
      <li><a href="movies.html">Movies</a></li>
    </ul>
    <div id="auth-container">
      <a href="signin.html" id="auth-btn" class="btn-auth">Sign In</a>
    </div>
  </header>

  <section class="signin-section">
    <div class="signin-container">
      <h1>Account Settings</h1>

      <form id="profile-form">
        <div class="input-box">
          <label for="profile-email">Email Address</label>
          <input type="email" id="profile-email" required>
        </div>

        <div class="input-box">
          <label for="profile-password">New Password (optional)</label>
          <input type="password" id="profile-password" placeholder="Enter new password">
        </div>

        <button type="submit" class="btn-submit">Save Changes</button>
      </form>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINDX CINEMAS - Stream Movies</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar" id="top_header">
    <a href="main.html" class="logo">MINDX CINEMAS</a>

    <ul class="nav-links">
      <li><a href="main.html">Home</a></li>
      <li><a href="movies.html">Movies</a></li>
    </ul>

    <div id="sign-in">
      <a href="signin.html" id="signin-link" class="btn-in">Sign In</a>

      <div class="user-menu-container hidden" id="user-menu">
        <button class="user-avatar-btn" id="avatar-btn"></button>
        <div class="user-dropdown-menu" id="dropdown-menu">
          <div class="dropdown-header">Signed in as: <strong id="user-email-display"></strong></div>
          <button class="dropdown-item" id="logout-btn">Log Out</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero-banner">
    <div class="hero-content">
      <h1>Unlimited Movies & Series</h1>
      <p>Discover thousands of popular blockbusters, classic films, and award-winning series right here.</p>
      <div class="hero-buttons">
        <a href="movies.html" class="btn-all">Browse All</a>
      </div>
    </div>
  </section>

  <main class="movie-rows"></main>

  <!-- Detail Popup -->
  <div class="overlay" id="detail">
    <div class="card">
      <button class="close" id="close" type="button">&times;</button>
      <div class="header" id="hero">
        <div class="header-content">
          <h2 id="title">Movie Title</h2>
          <button class="btn btn-primary" id="play-btn">▶ Play</button>
        </div>
      </div>
      <div class="detail-body">
        <div class="detail-metadata">
          <span class="badge" id="year">2024</span>
          <span class="badge" id="type">Movie</span>
          <span class="imdb-rating" id="rating">⭐ IMDb: N/A</span>
        </div>
        <p id="plot">Loading plot details...</p>
        <p id="actors" class="detail-subtext"><strong>Cast:</strong> Loading...</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
